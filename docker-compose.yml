name: petmarket

services:
  db:
    image: postgres:16-alpine
    container_name: petmarket_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petmarket_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petmarket_pass}
      POSTGRES_DB: ${POSTGRES_DB:-petmarket_db}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petmarket_user} -d ${POSTGRES_DB:-petmarket_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petmarket_app
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-petmarket_user}:${POSTGRES_PASSWORD:-petmarket_pass}@db:5432/${POSTGRES_DB:-petmarket_db}
    depends_on:
      db:
        condition: service_healthy

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petmarket_tests
    entrypoint: []
    command: ["sh", "-c", "alembic upgrade head && python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=80"]
    environment:
      REQUIRE_DB: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-petmarket_user}:${POSTGRES_PASSWORD:-petmarket_pass}@db:5432/${TEST_POSTGRES_DB:-petmarket_test}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-petmarket_user}:${POSTGRES_PASSWORD:-petmarket_pass}@db:5432/${TEST_POSTGRES_DB:-petmarket_test}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tests

volumes:
  postgres_data:
