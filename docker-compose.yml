name: petmarket

services:
  db:
    image: postgres:16-alpine
    container_name: petmarket_db
    environment:
      POSTGRES_USER: petmarket_user
      POSTGRES_PASSWORD: petmarket_pass
      POSTGRES_DB: petmarket_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petmarket_user -d petmarket_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

  db-setup:
    image: postgres:16-alpine
    container_name: petmarket_db_setup
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: petmarket_pass
    entrypoint: ["sh", "-c", "until pg_isready -h db -U petmarket_user; do sleep 1; done && psql -h db -U petmarket_user -d postgres -c \"CREATE DATABASE petmarket_test;\" && psql -h db -U petmarket_user -d petmarket_test -c \"CREATE EXTENSION IF NOT EXISTS \\\"uuid-ossp\\\";\""]
    profiles:
      - tests

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petmarket_app
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      PORT: 8000
      DATABASE_URL: postgresql://petmarket_user:petmarket_pass@db:5432/petmarket_db
    depends_on:
      db:
        condition: service_healthy

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petmarket_tests
    environment:
      REQUIRE_DB: "1"
      TEST_DATABASE_URL: postgresql://petmarket_user:petmarket_pass@db:5432/petmarket_test
      DATABASE_URL: postgresql://petmarket_user:petmarket_pass@db:5432/petmarket_db
    command: ["sh", "-c", "alembic upgrade head && pytest --cov=src --cov-fail-under=80 --cov-report=term-missing"]
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tests

volumes:
  postgres_data: