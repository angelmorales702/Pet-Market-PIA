[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "petmarket-backend"
version = "0.1.0"
description = "Backend API de PetMarket para Componentes de Lógica de Negocios (FIME-UANL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-markers -ra --cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@abstractmethod",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "def __repr__",
    "def __str__",
    "def __hash__",
    "def __post_init__",
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

# B008 es necesario para dependencias FastAPI (Depends, Body, Header) - patrón estándar
[tool.ruff.lint.per-file-ignores]
"src/api/main.py" = ["B008", "E501", "B904"]  # B904: HTTPException sin "from" en except
"tests/*.py" = ["E501", "E402"]  # E501: long lines, E402: imports after sys.path modifications
"src/domain/services.py" = ["E402"]  # Imports en medio del archivo por necesidad del código
