# Configuración de Alembic para migraciones de base de datos PetMarket
[alembic]
# Ruta al directorio de migraciones
script_location = src/infrastructure/migrations

# Template para nombres de archivos de migración
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Formato de fecha
date_format = %%Y-%%m-%%d %%H:%%M:%%S

# Motor de base de datos (se sobrescribe por variable de entorno)
sqlalchemy.url = postgresql://petmarket_user:petmarket_pass@localhost:5432/petmarket_db

# Configuración de logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S