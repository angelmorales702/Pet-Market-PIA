name: CI/CD Pipeline - PetMarket

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petmarket_user
          POSTGRES_PASSWORD: petmarket_pass
          POSTGRES_DB: petmarket_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://petmarket_user:petmarket_pass@localhost:5432/petmarket_db
        run: alembic upgrade head

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Pytest with Coverage Gate (≥80%)
        env:
          DATABASE_URL: postgresql://petmarket_user:petmarket_pass@localhost:5432/petmarket_db
        run: |
          pytest --cov=src --cov-fail-under=80 --cov-report=term-missing

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: petmarket-app:latest
