name: petmarket

services:
  db:
    image: postgres:16-alpine
    container_name: petmarket_db
    environment:
      POSTGRES_USER: petmarket_user
      POSTGRES_PASSWORD: petmarket_pass
      POSTGRES_DB: petmarket_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petmarket_user -d petmarket_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petmarket_app
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      PORT: 8000
      DATABASE_URL: postgresql://${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petmarket_tests
    environment:
      DATABASE_URL: postgresql://${DATABASE_URL}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/petmarket_db
    command: ["pytest", "--cov=src", "--cov-fail-under=80"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
