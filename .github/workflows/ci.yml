name: CI/CD Pipeline - PetMarket

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petmarket_user
          POSTGRES_PASSWORD: petmarket_pass
          POSTGRES_DB: petmarket_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff httpx python-dotenv

      - name: Ruff
        run: |
         ruff --version
         ruff check src tests --diff

      - name: Create test database
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://petmarket_user:petmarket_pass@localhost:5432/petmarket_db', autocommit=True); c.execute('CREATE DATABASE petmarket_test'); c.close()"

      - name: Run migrations on test database
        env:
          DATABASE_URL: postgresql://petmarket_user:petmarket_pass@localhost:5432/petmarket_test
        run: python -m alembic upgrade head

      - name: Pytest with coverage gate (80 percent)
        env:
          DATABASE_URL: postgresql://petmarket_user:petmarket_pass@localhost:5432/petmarket_db
          TEST_DATABASE_URL: postgresql://petmarket_user:petmarket_pass@localhost:5432/petmarket_test
          REQUIRE_DB: "1"
        run: python -m pytest --cov=src --cov-fail-under=80 --cov-report=term-missing

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: petmarket-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
